<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Enter a city..."
            class="search-input"
            id="search-input"
            required
          />
          <input type="submit" value="Search" class="search-button" />
        </form>
      </header>
      <main>
        <div class="weather-app-info">
          <div>
            <h1 class="weather-city" id="weather-city">Seoul</h1>
            <p class="weather-details">
              Tuesday 17:33, scattered clouds
              <br />
              Humidity: <strong>60%</strong>, Wind: <strong>5 km/h</strong>
            </p>
          </div>
          <div class="weather-temp-container">
            <div class="weather-icon">🌤️</div> 
            <div class="weather-temp">12</div>
            <div class="weather-unit">&deg;C</div>
        </div>
      </main>
      <footer>
        This project was coded by
        <a href="https://github.com/cocopuff79" target="_blank"
          >Nicole Williams</a
        >
        and is open sourced on
        <a href="https://github.com/cocopuff79/plus-weather-app" target="_blank"
          >GitHub</a
        >
        and hosted on
        <a href="https://weather-app-901.netlify.app/" target="_blank"
          >Netlify</a
        >.
      </footer>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
